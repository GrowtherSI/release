name: Notify docs site

# The docs site (gdibble/growther-docs) does NOT read this repository at request
# time. `scripts/build-content.mts` there pulls `docs/` from this repo at BUILD
# time and prerenders every page to static HTML, so a change here is invisible
# until that build runs again. Its deploy workflow accepts a
# `repository_dispatch` of type `docs-updated`; this is the thing that sends it.
#
# WHY THE FILTER IS NARROW, AND WHY IT IS NOT ONLY docs/
# The site prerenders more out of this repository than its markdown: the pages
# under `docs/`, and the release catalog `dist/c5/releases.json`, which supplies
# the version, the download URLs and the SHA-256 checksums baked into the built
# bundle. Filtering on `docs/**` alone was wrong for exactly that reason — a
# release updates the catalog and nothing else the site reads, so the site would
# have kept serving the PREVIOUS version's downloads and checksums until the
# next unrelated documentation edit happened to rebuild it.
#
# `dist/c5/changelog.json` is the third thing it reads, and it needs the same
# treatment. It is not needed for the release path — the release pipeline writes
# the ledger in the SAME commit as `releases.json`, so that push already matches
# the line above. It is here for the other path: an entry approved, or a
# published line corrected, out of band. Such a commit touches `changelog.json`
# and nothing else, and without this line it would not rebuild the site at all —
# the correction would sit in this repo looking landed while the site kept
# serving the old text, until some unrelated documentation edit happened to
# trigger a build.
#
# Everything else growther-c5's release.yml stages here — the per-version asset
# folders under `dist/c5/<tag>/`, `install.sh`, `install.ps1`, `README.md` — is
# not read by the site, so it still cannot cause a pointless redeploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "dist/c5/releases.json"
      - "dist/c5/changelog.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notify-docs
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask growther-docs to rebuild
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_DISPATCH_TOKEN:-}" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not set, so the docs site was NOT rebuilt and this change is not live."
            echo "Create a fine-grained PAT scoped to gdibble/growther-docs with Repository permissions > Contents: Read and write (which is what POST /dispatches requires), and add it as the repository secret DOCS_DISPATCH_TOKEN."
            echo "Until then, publish by hand: gh workflow run deploy.yml -R gdibble/growther-docs"
            exit 1
          fi
          # A failure here must be loud. A silent no-op would leave the site
          # showing yesterday's documentation with nothing to say so.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DOCS_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gdibble/growther-docs/dispatches \
            -d '{"event_type":"docs-updated"}'
          echo "Dispatched docs-updated to gdibble/growther-docs."
